name: Generate contribution snake

on:
  schedule:
    - cron: "17 6 * * *"   # daily
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-light.svg?color_snake=#ff3b1f&color_dots=#ececf0,#cce0f5,#80b3e6,#3385d6,#0066cc
            dist/snake-dark.svg?color_snake=#ff3b1f&color_dots=#1c1c1e,#0b2440,#0a4f99,#0a6fd8,#2997ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
