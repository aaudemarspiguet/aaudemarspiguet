SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#98989d">Allow?  rm -rf dist</text><text x="326" y="58" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" letter-spacing="1" fill="#ff3b1f">IN PROGRESS  ·  2026  ·  TYPESCRIPT</text><text x="326" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="36" font-weight="700" letter-spacing="-0.6" fill="#f5f5f7">Deck: an iPhone console for coding agents</text><text x="1156" y="62" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="26" fill="#98989d">↗</text><text x="326" y="142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="19" fill="#98989d">The phone beside your keyboard shows every agent session and the exact</text><text x="326" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="19" fill="#98989d">command it wants to run, so you can Allow or Deny in one press. A Windows</text><text x="326" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="19" fill="#98989d">tray agent wires into each agent's own hooks over local Wi-Fi.</text><rect x="326" y="222" width="185.6" height="30" rx="15" fill="#0b2440"/><text x="339" y="242" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#2997ff" textLength="159.6" lengthAdjust="spacingAndGlyphs">Expo + React Native</text><rect x="521.6" y="222" width="110.0" height="30" rx="15" fill="#0b2440"/><text x="534.6" y="242" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#2997ff" textLength="84.0" lengthAdjust="spacingAndGlyphs">Node agent</text><rect x="641.6" y="222" width="110.0" height="30" rx="15" fill="#0b2440"/><text x="654.6" y="242" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#2997ff" textLength="84.0" lengthAdjust="spacingAndGlyphs">WebSockets</text><rect x="761.6" y="222" width="152.0" height="30" rx="15" fill="#0b2440"/><text x="774.6" y="242" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#2997ff" textLength="126.0" lengthAdjust="spacingAndGlyphs">Liquid Glass UI</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>