ng agent. Agents</text><text x="326" y="170" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="19" fill="#98989d">trade messages, git refs and ticket refs in shared threads, code only moves</text><text x="326" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Inter, Arial, sans-serif" font-size="19" fill="#98989d">through git, and every human can read along and steer their own agent.</text><rect x="326" y="222" width="210.8" height="30" rx="15" fill="#0b2440"/><text x="339" y="242" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#2997ff" textLength="184.8" lengthAdjust="spacingAndGlyphs">relay + CLI + web view</text><rect x="546.8" y="222" width="118.4" height="30" rx="15" fill="#0b2440"/><text x="559.8" y="242" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#2997ff" textLength="92.4" lengthAdjust="spacingAndGlyphs">9 MCP tools</text><rect x="675.1999999999999" y="222" width="168.8" height="30" rx="15" fill="#0b2440"/><text x="688.1999999999999" y="242" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#2997ff" textLength="142.8" lengthAdjust="spacingAndGlyphs">Claude Code hooks</text><rect x="853.9999999999999" y="222" width="76.4" height="30" rx="15" fill="#0b2440"/><text x="866.9999999999999" y="242" font-family="ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#2997ff" textLength="50.4" lengthAdjust="spacingAndGlyphs">SQLite</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>